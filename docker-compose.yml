version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: grantcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grantcheck
      POSTGRES_USER: grantcheck
      POSTGRES_PASSWORD: grantcheck_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantcheck -d grantcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grantcheck-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://grantcheck:grantcheck_secret@db:5432/grantcheck
      LLM_PROVIDER: mock
      APP_ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grantcheck-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
